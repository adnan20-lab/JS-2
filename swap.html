<body>

<div class="container">
    <h2>Number Swapper</h2>
    
    <div class="input-group">
        <label for="firstInput">Enter first number (a):</label>
        <input type="number" id="firstInput" value="5">
    </div>
    
    <div class="input-group">
        <label for="secondInput">Enter second number (b):</label>
        <input type="number" id="secondInput" value="10">
    </div>
    
    <button onclick="swapNumbers()">Swap Numbers</button>
    
    <div id="output" class="result-box" style="display: none;"></div>
</div>

<script>
function swapNumbers() {
    // Get values from the HTML input fields
    const firstInput = document.getElementById("firstInput").value;
    const secondInput = document.getElementById("secondInput").value;

    // Convert inputs to numbers just like your original code
    let a = Number(firstInput);
    let b = Number(secondInput);

    // Capture the initial state
    let logText = `Before swapping:\na = ${a}\nb = ${b}\n\n`;

    // The identical array destructuring swap logic from your code
    [a, b] = [b, a];

    // Capture the swapped state
    logText += `After swapping:\na = ${a}\nb = ${b}`;

    // Display the results in the browser window
    const outputDiv = document.getElementById("output");
    outputDiv.innerText = logText;
    outputDiv.style.display = "block";
}
</script>

</body>
