<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Number Checker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Prime Number Checker</h2>

  <div class="field">
    <label for="primeInput">Enter a number:</label>
    <input type="number" id="primeInput" placeholder="e.g. 29" />
  </div>

  <button onclick="checkPrime()">Check Prime</button>

  <div id="result"></div>

  <script>
    function checkPrime() {
      const val = document.getElementById("primeInput").value.trim();
      const res = document.getElementById("result");

      if (val === "" || isNaN(val)) {
        res.textContent = "Please enter a valid number.";
        return;
      }

      const num = Number(val);

      if (num <= 1) {
        res.textContent = `${num} is NOT a prime number.`;
        return;
      }

      let isPrime = true;
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) {
          isPrime = false;
          break;
        }
      }

      if (isPrime) {
        res.textContent = `${num} IS a prime number.`;
      } else {
        res.textContent = `${num} is NOT a prime number.`;
      }
    }
  </script>

</body>
</html>
