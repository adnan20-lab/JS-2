<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Simple Interest Calculator</h2>
    
    <div class="input-group">
        <label for="principal">Enter principal amount:</label>
        <input type="number" id="principal" placeholder="e.g. 1000">
    </div>

    <div class="input-group">
        <label for="rate">Enter rate of interest:</label>
        <input type="number" id="rate" step="0.01" placeholder="e.g. 5">
    </div>

    <div class="input-group">
        <label for="time">Enter time in years:</label>
        <input type="number" id="time" placeholder="e.g. 2">
    </div>

    <button onclick="calculateSI()">Calculate</button>

    <div class="result" id="output"></div>
</div>

<script>
    function calculateSI() {
        // Fetch values from input fields
        const pInput = document.getElementById("principal").value;
        const rInput = document.getElementById("rate").value;
        const tInput = document.getElementById("time").value;

        // Convert string inputs to numbers
        const P = Number(pInput);
        const R = Number(rInput);
        const T = Number(tInput);

        // Perform the calculation logic from your Node.js code
        const SI = (P * R * T) / 100;

        // Display the output on the page
        if (pInput && rInput && tInput) {
            document.getElementById("output").innerText = "Simple Interest: " + SI;
        } else {
            document.getElementById("output").innerText = "Please fill in all fields.";
        }
    }
</script>

</body>
</html>
