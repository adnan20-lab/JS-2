<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
     <style>
        /* General layout and styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .calc-container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            background-color: #e9ecef;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="calc-container">
    <!-- First Input Field -->
    <div class="form-group">
        <label for="firstInput">First Number:</label>
        <input type="number" id="firstInput" placeholder="Enter first number">
    </div>

    <!-- Operator Selection Field -->
    <div class="form-group">
        <label for="operator">Operator:</label>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
    </div>

    <!-- Second Input Field -->
    <div class="form-group">
        <label for="secondInput">Second Number:</label>
        <input type="number" id="secondInput" placeholder="Enter second number">
    </div>

    <!-- Trigger Action Button -->
    <button onclick="runCalculator()">Calculate</button>

    <!-- Response Window Output Box -->
    <div class="result-box" id="output">Result: </div>
</div>

<script>
    function runCalculator() {
        // Fetch values from DOM inputs directly
        const firstInput = document.getElementById("firstInput").value;
        const operator = document.getElementById("operator").value;
        const secondInput = document.getElementById("secondInput").value;
        const outputDiv = document.getElementById("output");

        // Validate that both input elements contain values
        if (firstInput === "" || secondInput === "") {
            outputDiv.innerText = "Please enter both numbers.";
            return;
        }

        // Apply strict type casting exactly like your original script
        const a = Number(firstInput);
        const b = Number(secondInput);

        let result;

        // Your exact programmatic calculation workflow structure
        if (operator === "+") {
            result = a + b;
        } else if (operator === "-") {
            result = a - b;
        } else if (operator === "*") {
            result = a * b;
        } else if (operator === "/") {
            if (b === 0) {
                outputDiv.innerText = "Cannot divide by zero.";
                return;
            }
            result = a / b;
        } else {
            outputDiv.innerText = "Invalid operator.";
            return;
        }

        // Print final generated state inside UI framework viewport
        outputDiv.innerText = "Result: " + result;
    }
</script>

</body>
</html>
