<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sum of Digits Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 1.1rem;
    }
    .breakdown {
      margin-top: 0.5rem;
      color: #555;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h2>Sum of Digits Calculator</h2>

  <div class="field">
    <label for="numberInput">Enter a number:</label>
    <input type="number" id="numberInput" placeholder="e.g. 4567" />
  </div>

  <button onclick="calculateSum()">Calculate Sum</button>

  <div id="result"></div>

  <script>
    function calculateSum() {
      const inputVal = document.getElementById("numberInput").value.trim();
      const resultDiv = document.getElementById("result");

      if (inputVal === "" || isNaN(inputVal)) {
        resultDiv.innerHTML = "<strong>Please enter a valid number.</strong>";
        return;
      }

      // Extract only numeric digits (ignoring negative signs or decimals)
      const digits = inputVal.replace(/[^0-9]/g, "").split("");

      if (digits.length === 0) {
        resultDiv.innerHTML = "<strong>Please enter at least one digit.</strong>";
        return;
      }

      const sum = digits.reduce((acc, curr) => acc + Number(curr), 0);
      const expression = digits.join(" + ");

      resultDiv.innerHTML = `
        <div><strong>Sum of Digits: ${sum}</strong></div>
        <div class="breakdown">Calculation: ${expression} = ${sum}</div>
      `;
    }
  </script>

</body>
</html>
