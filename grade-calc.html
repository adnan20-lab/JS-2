<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Grade Calculator</h2>

  <div class="field">
    <label for="marksInput">Enter marks:</label>
    <input type="number" id="marksInput" placeholder="e.g. 85" min="0" max="100" />
  </div>

  <button onclick="calculateGrade()">Calculate Grade</button>

  <div id="result"></div>

  <script>
    function calculateGrade() {
      const inputVal = document.getElementById("marksInput").value;
      const resultDiv = document.getElementById("result");

      if (inputVal.trim() === "") {
        resultDiv.textContent = "Please enter your marks.";
        return;
      }

      const marks = Number(inputVal);

      if (isNaN(marks)) {
        resultDiv.textContent = "Please enter a valid number.";
        return;
      }

      if (marks >= 90) {
        resultDiv.textContent = "Grade: A";
      } else if (marks >= 75) {
        resultDiv.textContent = "Grade: B";
      } else if (marks >= 60) {
        resultDiv.textContent = "Grade: C";
      } else if (marks >= 40) {
        resultDiv.textContent = "Grade: D";
      } else {
        resultDiv.textContent = "Fail";
      }
    }
  </script>

</body>
</html>
