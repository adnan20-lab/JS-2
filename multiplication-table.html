<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Table Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    .error {
      color: #d9534f;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Multiplication Table Generator</h2>

  <div class="field">
    <label for="numInput">Enter a number:</label>
    <input type="number" id="numInput" placeholder="e.g. 5" />
  </div>

  <div class="field">
    <label for="limitInput">Range (up to):</label>
    <input type="number" id="limitInput" value="10" min="1" max="100" />
  </div>

  <button onclick="generateTable()">Generate Table</button>

  <div id="result"></div>

  <script>
    function generateTable() {
      const numVal = document.getElementById("numInput").value;
      const limitVal = document.getElementById("limitInput").value;
      const resultDiv = document.getElementById("result");

      if (numVal.trim() === "") {
        resultDiv.innerHTML = '<p class="error">Please enter a valid number.</p>';
        return;
      }

      const num = Number(numVal);
      const limit = Number(limitVal) || 10;

      let tableHTML = `
        <h3>Table of ${num}</h3>
        <table>
          <thead>
            <tr>
              <th>Multiplier</th>
              <th>Expression</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (let i = 1; i <= limit; i++) {
        tableHTML += `
          <tr>
            <td>${num} × ${i}</td>
            <td>${num} * ${i}</td>
            <td><strong>${num * i}</strong></td>
          </tr>
        `;
      }

      tableHTML += `
          </tbody>
        </table>
      `;

      resultDiv.innerHTML = tableHTML;
    }
  </script>

</body>
</html>
