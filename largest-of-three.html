<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Largest Number</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Find the Largest Number</h2>

  <div class="field">
    <label for="firstInput">Enter first number:</label>
    <input type="number" id="firstInput" placeholder="e.g. 10" />
  </div>

  <div class="field">
    <label for="secondInput">Enter second number:</label>
    <input type="number" id="secondInput" placeholder="e.g. 25" />
  </div>

  <div class="field">
    <label for="thirdInput">Enter third number:</label>
    <input type="number" id="thirdInput" placeholder="e.g. 15" />
  </div>

  <button onclick="findLargest()">Find Largest</button>

  <div id="result"></div>

  <script>
    function findLargest() {
      const input1 = document.getElementById("firstInput").value;
      const input2 = document.getElementById("secondInput").value;
      const input3 = document.getElementById("thirdInput").value;
      const resultDiv = document.getElementById("result");

      if (input1.trim() === "" || input2.trim() === "" || input3.trim() === "") {
        resultDiv.textContent = "Please enter all three numbers.";
        return;
      }

      const a = Number(input1);
      const b = Number(input2);
      const c = Number(input3);

      let largest;
      if (a >= b && a >= c) {
        largest = a;
      } else if (b >= a && b >= c) {
        largest = b;
      } else {
        largest = c;
      }

      resultDiv.textContent = `Largest: ${largest}`;
    }
  </script>

</body>
</html>
