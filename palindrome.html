<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Palindrome Checker</h2>

  <div class="field">
    <label for="strInput">Enter a word, phrase, or number:</label>
    <input type="text" id="strInput" placeholder="e.g. racecar or 12321" />
  </div>

  <button onclick="checkPalindrome()">Check Palindrome</button>

  <div id="result"></div>

  <script>
    function checkPalindrome() {
      const rawInput = document.getElementById("strInput").value.trim();
      const res = document.getElementById("result");

      if (rawInput === "") {
        res.textContent = "Please enter something to check.";
        return;
      }

      // Remove non-alphanumeric characters and convert to lowercase
      const cleanedStr = rawInput.toLowerCase().replace(/[^a-z0-0]/g, "");
      const reversedStr = cleanedStr.split("").reverse().join("");

      if (cleanedStr === reversedStr) {
        res.textContent = `"${rawInput}" IS a palindrome!`;
      } else {
        res.textContent = `"${rawInput}" is NOT a palindrome.`;
      }
    }
  </script>

</body>
</html>
