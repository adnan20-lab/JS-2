<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count Vowels</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
      height: 100px;
      resize: vertical;
    }
    button {
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Vowel Counter</h2>

  <div class="field">
    <label for="textInput">Enter text:</label>
    <textarea id="textInput" placeholder="e.g. Hello World"></textarea>
  </div>

  <button onclick="countVowels()">Count Vowels</button>

  <div id="result"></div>

  <script>
    function countVowels() {
      const str = document.getElementById("textInput").value;
      const res = document.getElementById("result");

      if (str.trim() === "") {
        res.textContent = "Please enter some text.";
        return;
      }

      // Match all vowels (a, e, i, o, u) case-insensitively
      const matches = str.match(/[aeiou]/gi);
      const count = matches ? matches.length : 0;

      res.textContent = `Total Vowels: ${count}`;
    }
  </script>

</body>
</html>
